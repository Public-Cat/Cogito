# Cogito reverse-proxy stack: Caddy (LAN + public vhosts) and, optionally, a
# Cloudflare Tunnel container that publishes the public vhost to the internet
# with no inbound firewall ports opened. Runs alongside the root
# docker-compose.yml (the app + the cogito-net network) — bring that up first.
#
# LAN-only (e.g. running tests/join.mjs, no real domain/tunnel yet):
#   cp deploy/.env.example deploy/.env   # placeholder values are fine for this
#   docker compose -f deploy/docker-compose.yml up -d
#
# Full stack — public + LAN, real deployment or full-stack local testing:
#   cp deploy/.env.example deploy/.env   # fill in TUNNEL_TOKEN + COGITO_PUBLIC_DOMAIN
#   docker compose -f deploy/docker-compose.yml --profile tunnel up -d
#
# Tear down:
#   docker compose -f deploy/docker-compose.yml --profile tunnel down

services:
  caddy:
    image: caddy:2
    container_name: cogito-caddy
    networks:
      - cogito-net
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

  # Only started with `--profile tunnel`. Reaches Caddy over cogito-net by
  # container name (cogito-caddy:443) — see README.md for the matching
  # "Public Hostname" service address to set in the Cloudflare dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cogito-cloudflared
    networks:
      - cogito-net
    restart: unless-stopped

networks:
  # Created by the root docker-compose.yml; referenced here as external so
  # Caddy/cloudflared can reach the `cogito` container by name.
  cogito-net:
    external: true
    name: cogito-net

volumes:
  caddy_data:
