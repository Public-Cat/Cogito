# Cogito reverse-proxy stack: Caddy (LAN + public vhosts) and a Cloudflare
# Tunnel container that publishes the public vhost to the internet with no
# inbound firewall ports opened. Runs alongside the root docker-compose.yml
# (the app + the cogito-net network) — bring that up first.
#
# LAN-only (e.g. running tests/join.mjs, no real domain/tunnel yet):
#   cp deploy/.env.example deploy/.env   # placeholder values are fine for this
#   docker compose -f deploy/docker-compose.yml up -d
#
# Full stack — public + LAN, real deployment or full-stack local testing:
#   cp deploy/.env.example deploy/.env   # fill in TUNNEL_TOKEN + COGITO_PUBLIC_DOMAIN
#   docker compose -f deploy/docker-compose.yml up -d
#
# Tear down:
#   docker compose -f deploy/docker-compose.yml down

services:
  caddy:
    image: caddy:2
    container_name: cogito-caddy
    networks:
      - cogito-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      - COGITO_PUBLIC_DOMAIN=${COGITO_PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddy/data:/data
    restart: unless-stopped

  # Reaches Caddy over cogito-net by container name (cogito-caddy:80) — see
  # README.md for the matching "Public Hostname" service address to set in
  # the Cloudflare dashboard. Only TUNNEL_TOKEN is passed in (not the rest of
  # .env) so Caddy's COGITO_PUBLIC_DOMAIN never ends up in this container.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cogito-cloudflared
    networks:
      - cogito-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    restart: unless-stopped

networks:
  # Created by the root docker-compose.yml; referenced here as external so
  # Caddy/cloudflared can reach the `cogito` container by name.
  cogito-net:
    external: true
    name: cogito-net
