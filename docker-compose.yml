services:
  cogito:
    container_name: cogito
    build: .
    networks:
      - cogito-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://192.168.1.30:11434
      - PORT=3000
      # HOST controls which interface the Node process binds inside the
      # container — it does NOT make this safe to expose on the LAN/WAN.
      # No port is published to the host at all: the only access path is
      # the `cogito-net` network below, which deploy/docker-compose.yml's
      # `caddy` service attaches to (see deploy/README.md) — don't attach
      # anything else to it.
      - HOST=0.0.0.0
      # SECURITY: set ALLOWED_ORIGINS in a .env file next to this compose file
      # (copy .env.example) — must match the vhost blocks in deploy/Caddyfile
      # (see deploy/README.md). Comma-separated, no spaces.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: unless-stopped

networks:
  # Defines the network Caddy needs to join to reach Cogito by container name
  # (`cogito:3000`). deploy/docker-compose.yml's `caddy` service attaches to
  # this network as `external` — see deploy/README.md.
  cogito-net:
    name: cogito-net
    driver: bridge
